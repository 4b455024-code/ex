      background: skyblue;

    aside {

    }

    .photo-area {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;

    }

    .photo-area img {
      width: 120px;
      height: auto;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.7);
    }

    @media (max-width: 768px) {
      body { min-width: 0; }
      .container { flex-direction: column; }
      main, aside { width: 100%; }
      nav ul { flex-direction: column; align-items: flex-start; }
